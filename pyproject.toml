[project]
name = "qa-guided-reasoning"
version = "0.1.0"
description = "QA-guided reasoning for character descriptions in books"
requires-python = ">=3.10,<3.13"
dependencies = [
    "nltk>=3.9,<4",
    "pandas>=2.2,<3",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
    "Unidecode>=1.3,<2",
]

[dependency-groups]
inference = [
    "torch>=2.4",
    "transformers>=4.51.3,<5",
    "vllm==0.10.0",
]
sft = [
    "unsloth==2025.8.1",
    "unsloth-zoo==2025.8.1",
    "trl==0.19.1",
    "datasets>=3.4.1,<4",
    "peft>=0.17,<0.18",
    "wandb",
]
rl = [
    {include-group = "inference"},
    "openrlhf[vllm]==0.8.9",
    "fastapi",
    "uvicorn",
]
evaluation = [
    "torch>=2.4",
    "transformers>=4.51.3,<5",
    "bert-score>=0.3.13,<0.4",
    "rouge-score>=0.1.2,<0.2",
    "spacy>=3.8,<4",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.extra-build-dependencies]
flash-attn = [{requirement = "torch", match-runtime = true}, "packaging", "ninja"]
deepspeed = [{requirement = "torch", match-runtime = true}]
